# 构建使用 JDK 21，产物的 Java 编译级别由根 POM 单独控制。
# 参考：https://docs.github.com/actions/use-cases-and-examples/building-and-testing/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ master, master-jdk17, master-jdk25 ]
  # pull_request:
  #   branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: '**/pom.xml'
    - name: Install Maven 3.9.12
      shell: bash
      run: |
        archive="$RUNNER_TEMP/apache-maven-3.9.12-bin.tar.gz"
        curl --fail --show-error --silent --location --retry 3 \
          https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.12/apache-maven-3.9.12-bin.tar.gz \
          --output "$archive"
        printf '%s  %s\n' '0a1be79f02466533fc1a80abbef8796e4f737c46c6574ede5658b110899942a94db634477dfd3745501c80aef9aac0d4f841d38574373f7e2d24cce89d694f70' "$archive" | sha512sum --check
        tar -xzf "$archive" -C "$RUNNER_TEMP"
        printf '%s\n' "$RUNNER_TEMP/apache-maven-3.9.12/bin" >> "$GITHUB_PATH"
    - name: Verify build toolchain
      run: bash script/shell/check-build-toolchain.sh
    - name: Build with Maven
      run: mvn -B -ntp -C package --file pom.xml -Dmaven.test.skip=true
